[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydantic-env-manager"
version = "0.1.0"
description = "Manage .env and .env.example for FastAPI/Pydantic apps: declare variables once in your Settings class; files stay complete and agents can check them without reading secrets."
readme = "README.md"
keywords = ["pydantic", "pydantic-settings", "fastapi", "dotenv", "env", "settings", "cli"]
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Yashu Ranparia" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["pydantic-settings>=2"]

[project.urls]
Homepage = "https://github.com/YashuRanparia/pydantic-env-manager"
Issues = "https://github.com/YashuRanparia/pydantic-env-manager/issues"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
pydantic-env-manager = "pydantic_env_manager.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pydantic_env_manager"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
