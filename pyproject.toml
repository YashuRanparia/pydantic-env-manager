[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "envsync"  # placeholder, rename when the package name is decided
version = "0.1.0"
description = "Keep .env and .env.example in sync with a Pydantic v2 BaseSettings class."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = ["pydantic-settings>=2"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
envsync = "envsync.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/envsync"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
