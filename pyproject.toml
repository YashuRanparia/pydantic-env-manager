[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pydantic-env-manager"
version = "0.1.0"
description = "Manage .env and .env.example for FastAPI/Pydantic apps: declare variables once in your Settings class; files stay complete and agents can check them without reading secrets."
readme = "README.md"
keywords = ["pydantic", "pydantic-settings", "fastapi", "dotenv", "env", "settings", "cli"]
requires-python = ">=3.9"
license = "MIT"
dependencies = ["pydantic-settings>=2"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
pydantic-env-manager = "pydantic_env_manager.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pydantic_env_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
